<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Athena — Test User Setup</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 540px; margin: 60px auto; padding: 0 24px; background: #f9f8f6; color: #1a1a1a; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    p { color: #666; font-size: 14px; margin-bottom: 28px; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .card h3 { margin: 0 0 4px; font-size: 14px; }
    .card .email { font-family: monospace; font-size: 13px; color: #555; margin-bottom: 12px; }
    .status { font-size: 13px; padding: 8px 12px; border-radius: 6px; margin-top: 10px; display: none; }
    .status.ok  { background: #ecfdf5; color: #166534; border: 1px solid #bbf7d0; display: block; }
    .status.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }
    .status.info{ background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; display: block; }
    button { background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 7px; font-size: 14px; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.run-all { width: 100%; padding: 13px; font-size: 15px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>Athena Compounding — Test User Setup</h1>
  <p>Creates fresh test accounts in Supabase. Run once after deleting old users. Delete this page when done.</p>

  <button class="run-all" id="runAll">Create all test users</button>

  <div class="card" id="card-provider">
    <h3>Provider account</h3>
    <div class="email">provider@athena.test · AthenaTest25!</div>
    <div class="status" id="status-provider">Waiting…</div>
  </div>

  <div class="card" id="card-pharmacy">
    <h3>Pharmacy Staff account</h3>
    <div class="email">pharmacy@athena.test · AthenaTest25!</div>
    <div class="status" id="status-pharmacy">Waiting…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://caiaqqsmvlztfnyyglss.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhaWFxcXNtdmx6dGZueXlnbHNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MzQ3MzIsImV4cCI6MjA5MzQxMDczMn0.b4O-qQwWaU75to0XwFBfe8DegWXfMScuTGTehfYjX0c';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function setStatus(id, type, msg) {
      const el = document.getElementById('status-' + id);
      el.className = 'status ' + type;
      el.textContent = msg;
    }

    async function createUser(email, password, role) {
      const id = role;
      setStatus(id, 'info', 'Creating account…');

      // 1. Sign up
      const { data: signUpData, error: signUpErr } = await sb.auth.signUp({ email, password });
      if (signUpErr) {
        setStatus(id, 'err', 'Sign-up failed: ' + signUpErr.message);
        return false;
      }

      const userId = signUpData.user?.id;
      if (!userId) {
        setStatus(id, 'err', 'No user ID returned — check Supabase email confirmation settings.');
        return false;
      }

      setStatus(id, 'info', 'Inserting profile…');

      // 2. Insert profile row
      const { error: profileErr } = await sb.from('profiles').insert({ id: userId, role });
      if (profileErr) {
        setStatus(id, 'err', 'Profile insert failed: ' + profileErr.message);
        return false;
      }

      // 3. For provider, seed an empty onboarding row
      if (role === 'provider') {
        setStatus(id, 'info', 'Creating onboarding record…');
        const { error: obErr } = await sb.from('provider_onboardings').insert({ user_id: userId });
        if (obErr) {
          setStatus(id, 'err', 'Onboarding insert failed: ' + obErr.message);
          return false;
        }
      }

      // 4. Sign out (so next creation is independent)
      await sb.auth.signOut();

      setStatus(id, 'ok', '✓ Created successfully');
      return true;
    }

    document.getElementById('runAll').addEventListener('click', async function() {
      this.disabled = true;
      this.textContent = 'Creating…';

      const ok1 = await createUser('provider@athena.test', 'AthenaTest25!', 'provider');
      const ok2 = await createUser('pharmacy@athena.test', 'AthenaTest25!', 'pharmacy');

      this.textContent = (ok1 && ok2) ? '✓ All done — you can delete setup.html' : 'Done (check errors above)';
    });
  </script>
</body>
</html>
